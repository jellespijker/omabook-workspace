# .herdr-kanban.toml — shared multi-agent Kanban configuration.

[board]
project_owner = "jellespijker"
project_number = 8
target_branch = "main"
remote = "origin"
lease_ttl_minutes = 30
require_review = false
auto_ready_deposits = false
close_issue_on_done = true
priority_field = "Priority"
priorities = ["P0", "P1", "P2", "P3"]
require_priority_for_ready = true

[columns]
triage = "Triage"
ready = "Ready"
in_progress = "In Progress"
blocked = "Blocked"
review = "Review"
done = "Done"

# Label taxonomy, provisioned in every repository by `herdr-kanban sync-labels`.
# Same facet design as the unimotion board; domain and type are required to be Ready.

[taxonomy.facets.domain]
prefix = "domain:"
values = ["library", "reader", "metadata", "sync-share", "ai-mcp", "plugins", "packaging-release", "telemetry", "accessibility", "dx"]
required_for_ready = true
multiple = true
color = "1d76db"
description = "Area of Omabook (library, reader, metadata, sync, AI, plugins, release, telemetry, a11y, dx)"

[taxonomy.facets.type]
prefix = "type:"
values = ["feature", "bug", "doc", "chore", "spike"]
required_for_ready = true
multiple = false
color = "0e8a16"
description = "Ticket classification (feature, bug, doc, chore, spike)"

[repos.omabook]
owner = "jellespijker"
repo = "omabook"
path = "omabook"
# Builds with limited parallelism (bin/build), then every test suite.
check_command = "bin/build && QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure"

[repos.storyteller]
owner = "jellespijker"
repo = "omabook-storyteller"
path = "omabook-storyteller"
# The story pipeline and skills with the stand-in model; needs omabook on PATH.
check_command = "python3 tests/run.py && python3 tests/evals.py"
